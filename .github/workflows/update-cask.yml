# .github/workflows/update-cask.yml (in homebrew-bocan repo)
name: Update cask
on:
  repository_dispatch:
    types: [new-release]
jobs:
  update:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Update version and sha256
        env:
          VERSION: ${{ github.event.client_payload.version }}
          SHA256: ${{ github.event.client_payload.sha256 }}
        run: |
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/bocan.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/bocan.rb
      # Commit straight to main. The previous create-pull-request flow left
      # the bump in an unmerged PR for months while reporting success, so
      # brew served a stale cask (0.12.0 until 2.12.0 was hand-merged).
      - name: Commit and push
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/bocan.rb
          if git diff --cached --quiet; then
            echo "Cask already at ${VERSION}; nothing to commit."
            exit 0
          fi
          git commit -m "chore: bump cask to ${VERSION}"
          git push
